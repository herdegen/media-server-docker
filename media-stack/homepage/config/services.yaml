- Jellyfin:
    - Jellyfin:
        icon: jellyfin.png
        href: http://<SERVER_IP>:8096
        description: Médiathèque
        # Jellyfin 12 a supprime les routes /emby/ et l'auth api_key= que le widget
        # natif "jellyfin" utilise toujours (gabarit {url}/emby/{endpoint}?api_key={key},
        # encore present en Homepage 2.4.0) -> 404 a corps vide -> JSON.parse error.
        # Contournement : customapi + auth moderne "Authorization: MediaBrowser Token".
        widget:
          type: customapi
          url: http://host.docker.internal:8096/Items/Counts
          method: GET
          headers:
            Authorization: MediaBrowser Token="{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          mappings:
            - field: MovieCount
              label: Films
            - field: SeriesCount
              label: Series
            - field: EpisodeCount
              label: Episodes
            - field: SongCount
              label: Titres
