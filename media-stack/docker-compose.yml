# Tout le stack derrière Gluetun (WireGuard Mullvad)

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    # Provider VPN piloté par preset (bascule via ./vpn-switch.sh nordvpn|mullvad)
    env_file:
      - ./vpn/active.env
    environment:
      - TZ=${TZ}
      # DNS : gluetun récent (2026-06) a migré DOT -> DNS_UPSTREAM_RESOLVER_TYPE.
      # On laisse le défaut = serveur DNS-over-TLS intégré (Cloudflare, chiffré, anti-fuite).
      # Ancien "DOT=off" retiré : cassait le démarrage ("upstream type dot must be plain
      # if the built-in DNS server is disabled"). 2026-06-29
      # --- Control server (widget VPN Homepage), auth par apikey ---
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/auth/config.toml
    volumes:
      - ${GLUETUN_DATA}:/gluetun
    # Expose ici tous les ports des services qui sont derrière le VPN
    ports:
      # Bind sur la passerelle docker (172.17.0.1) = accessible aux conteneurs (Homepage) mais PAS depuis Internet. Accès navigateur via Traefik+OAuth. (durci 2026-06-16)
      - "172.17.0.1:9091:9091"  # Transmission
      - "172.17.0.1:9696:9696"  # Prowlarr
      - "172.17.0.1:8989:8989"  # Sonarr
      - "172.17.0.1:7878:7878"  # Radarr
      - "172.17.0.1:6868:6868"  # ROMarr
      - "172.17.0.1:8686:8686"  # Lidarr
      - "172.17.0.1:5030:5030"  # slskd (Soulseek)
      # FlareSolverr 8191 : plus publié (utilisé seulement par Prowlarr en interne via localhost dans le netns gluetun)
      - "172.17.0.1:8000:8000"  # Control server gluetun (non-public, gateway docker)
    # Healthcheck natif gluetun (binaire interne, pas de wget qui s'accumule en cas de VPN down)
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${PROWLARR_CONFIG}:/config
    network_mode: "service:gluetun"
    depends_on:
      flaresolverr:
        condition: service_started
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002   # dossiers/médias créés en group-writable (775/664) -> archivage Glacier OK
    volumes:
      - ${SONARR_CONFIG}:/config
      # Montage unique parent -> hardlinks downloads<->lib OK (root folder = /data/series). 2026-06-28
      - ${MEDIA_ROOT}:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002   # dossiers/médias créés en group-writable (775/664) -> archivage Glacier OK
    volumes:
      - ${RADARR_CONFIG}:/config
      # Montage unique parent -> hardlinks downloads<->lib OK (root folder = /data/movies/movies). 2026-06-28
      - ${MEDIA_ROOT}:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${TRANSMISSION_CONFIG}:/config
      # Montage unique parent (download-dir=/data/downloads/complete, watch=/data/watch). 2026-06-28
      - ${MEDIA_ROOT}:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  lidarr:
    # *arr pour la musique (root folder /data/music). 2026-10-08
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /var/lib/lidarr:/config
      # Montage unique parent -> hardlinks downloads<->lib OK (root folder = /data/music)
      - ${MEDIA_ROOT}:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  slskd:
    # Client Soulseek (source musique de Lidarr via Soularr). Config /var/lib/slskd/slskd.yml. 2026-10-08
    image: slskd/slskd:latest
    container_name: slskd
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=false
    volumes:
      - /var/lib/slskd:/app
      - ${MEDIA_ROOT}:/data
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  soularr:
    # Pont Lidarr (albums surveillés manquants) -> slskd -> import Lidarr. Config /var/lib/soularr/config.ini
    image: mrusse08/soularr:latest
    container_name: soularr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=false
    volumes:
      - /var/lib/soularr:/data
      - ${MEDIA_ROOT}/downloads/complete/soulseek:/downloads
    network_mode: "service:gluetun"
    depends_on:
      - slskd
      - lidarr
    restart: unless-stopped

  romarr:
    # *arr pour les ROMs (Prowlarr -> Transmission -> /srv/games, lu par le plugin Jellyfin Moonbase). 2026-09-28
    image: ghcr.io/blizzhacker/romarr:latest
    container_name: romarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      # Seed au 1er démarrage uniquement, ensuite tout se règle dans l'UI
      - PROWLARR_URL=http://localhost:9696
      - LIBRARY_KIND=folder
      - LIBRARY_PATH=/roms
      - LOG_LEVEL=INFO
    volumes:
      - /var/lib/romarr:/config
      - /srv/games:/roms
      # ROMarr range la Megadrive dans "genesis-slash-megadrive", nom que Moonbase ne reconnaît pas
      - /srv/games/genesis:/roms/genesis-slash-megadrive
      # Même chemin que celui rapporté par Transmission
      - ${MEDIA_ROOT}/downloads:/data/downloads:ro
      # Correctif local : ROMarr 0.9.0 ne sait pas lister les téléchargements finis de Transmission
      - ./romarr/sitecustomize.py:/usr/local/lib/python3.13/site-packages/sitecustomize.py:ro
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  media-mcp:
    build:
      context: ./media-mcp
    container_name: media-mcp
    env_file: ./media-mcp/.env
    restart: unless-stopped
    expose:
      - "18080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy

      # Service backend
      - traefik.http.services.mcp.loadbalancer.server.port=18080
      - traefik.http.services.mcp.loadbalancer.passhostheader=true

      # /health (public direct)
      - traefik.http.routers.mcp-health.rule=Host(`mcp.maxibestof.com`) && Path(`/health`)
      - traefik.http.routers.mcp-health.entrypoints=websecure
      - traefik.http.routers.mcp-health.tls.certresolver=le
      - traefik.http.routers.mcp-health.priority=1003
      - traefik.http.routers.mcp-health.service=mcp

      # well-known (public)
#      - traefik.http.routers.mcp-wk.rule=Host(`mcp.maxibestof.com`) && Path(`/.well-known/oauth-protected-resource`)
#      - traefik.http.routers.mcp-wk.entrypoints=websecure
#      - traefik.http.routers.mcp-wk.tls.certresolver=le
#      - traefik.http.routers.mcp-wk.priority=1002
#      - traefik.http.routers.mcp-wk.service=mcp

      # /mcp (public) -> strip vers /
      - traefik.http.routers.mcp-api.rule=Host(`mcp.maxibestof.com`) && PathPrefix(`/mcp`)
      - traefik.http.routers.mcp-api.entrypoints=websecure
      - traefik.http.routers.mcp-api.tls.certresolver=le
      - traefik.http.routers.mcp-api.priority=1001
#      - traefik.http.routers.mcp-api.middlewares=mcp-strip
      - traefik.http.routers.mcp-api.service=mcp

      # Strip du préfixe /mcp
#      - traefik.http.middlewares.mcp-strip.stripprefix.prefixes=/mcp
    networks:
      - traefik-proxy
    # IMPORTANT : même namespace réseau que tes apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pas de "ports:" ici, c'est gluetun qui publie 8080
    # Monte facultatif si tu veux que MCP lise/écrive dans /media
    # volumes:
    #   - ${MEDIA_MOVIES}:/media/films:rw
    #   - ${MEDIA_TV}:/media/series:rw
    # Harmoniser l'UID/GID si besoin
    user: "${PUID}:${PGID}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.7.14  # épinglé 2026-10-13 (était v3 flottant)
    container_name: traefik
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Tout le HTTP part en HTTPS (le challenge ACME reste servi en priorité par Traefik)
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=sec-headers@file
      - --certificatesresolvers.le.acme.email=${LE_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./traefik/dynamic:/dynamic:ro
    networks:
      - traefik-proxy
      - ops-net
    restart: unless-stopped


  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5  # épinglé 2026-10-13
    container_name: oauth2-proxy
    env_file: ./oauth2-proxy.env
    networks:
      - traefik-proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy

      # Router pour auth.maxibestof.com (pages d'authentification)
      - traefik.http.routers.oauth.rule=Host(`auth.maxibestof.com`)
      - traefik.http.routers.oauth.entrypoints=websecure
      - traefik.http.routers.oauth.tls.certresolver=le

      # Service oauth2-proxy
      - traefik.http.services.oauth.loadbalancer.server.port=4180
      - traefik.http.services.oauth.loadbalancer.passhostheader=true

      # --- Middleware forwardAuth réutilisable (protège home.maxibestof.com) ---
      # Adresse = racine oauth2-proxy : 302 vers GitHub si non authentifié (relayé par Traefik),
      # 202 via upstream static si authentifié. Pas besoin de middleware errors.
      - traefik.http.middlewares.oauth-auth.forwardauth.address=http://oauth2-proxy:4180/
      - traefik.http.middlewares.oauth-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.oauth-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token
      # Router /oauth2/* sur home.maxibestof.com (callback + sign-in)
      - traefik.http.routers.oauth-home.rule=Host(`home.maxibestof.com`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.oauth-home.entrypoints=websecure
      - traefik.http.routers.oauth-home.tls.certresolver=le
      - traefik.http.routers.oauth-home.service=oauth
      - traefik.http.routers.oauth-home.priority=100

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=106          # groupe docker (GID hôte) comme groupe primaire -> accès socket
      - HOMEPAGE_ALLOWED_HOSTS=home.maxibestof.com
    env_file: ./homepage.env
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik-proxy
      # tuile "Statut" : lit http://ops-console:8080/api/status/summary (sans OAuth,
      # sans topic). Homepage a deja docker.sock : aucun privilege en plus.
      - ops-net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.http.services.homepage.loadbalancer.passhostheader=true
      # Homepage reste le CATCH-ALL du domaine (priorite par defaut, la plus
      # basse) : ses assets absolus /_next/..., /api/config/..., /favicon...
      # lui parviennent donc toujours, meme quand il est affiche sous /old.
      - traefik.http.routers.homepage.rule=Host(`home.maxibestof.com`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=le
      - traefik.http.routers.homepage.middlewares=oauth-auth@docker
      # L'ancien dashboard est servi sous /old (prefixe retire apres auth).
      - traefik.http.middlewares.old-strip.stripprefix.prefixes=/old
      - traefik.http.routers.homepageold.rule=Host(`home.maxibestof.com`) && PathPrefix(`/old`)
      - traefik.http.routers.homepageold.entrypoints=websecure
      - traefik.http.routers.homepageold.tls.certresolver=le
      - traefik.http.routers.homepageold.priority=250
      - traefik.http.routers.homepageold.service=homepage
      - traefik.http.routers.homepageold.middlewares=oauth-auth@docker,old-strip@docker

  vpn-control:
    build:
      context: ./vpn-control
    container_name: vpn-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Stack en lecture seule (compose a besoin du compose + .env), écriture
      # limitée à vpn/ (active.env) — avant : tout /srv/media-stack en écriture.
      - /srv/media-stack:/srv/media-stack:ro
      - /srv/media-stack/vpn:/srv/media-stack/vpn
      - /srv/docker/gluetun/auth/.apikey.txt:/gluetun-auth/.apikey.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Réseau dédié avec Traefik : sur traefik-proxy, n'importe quel conteneur
    # (memorylane, mandrillcomics…) pouvait le joindre sans passer par l'OAuth.
    networks:
      - ops-net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=ops-net
      - traefik.http.services.vpnctl.loadbalancer.server.port=8080
      # /vpn sur home.maxibestof.com, protégé par le même OAuth, préfixe strippé
      - traefik.http.middlewares.vpn-strip.stripprefix.prefixes=/vpn
      - traefik.http.routers.vpnctl.rule=Host(`home.maxibestof.com`) && PathPrefix(`/vpn`)
      - traefik.http.routers.vpnctl.entrypoints=websecure
      - traefik.http.routers.vpnctl.tls.certresolver=le
      - traefik.http.routers.vpnctl.priority=200
      # OAuth AVANT le strip : sinon le skip-auth ^/health$ matchait /vpn/health
      - traefik.http.routers.vpnctl.middlewares=oauth-auth@docker,vpn-strip@docker

  # Console d'ops graphique : /ops sur home.maxibestof.com (meme OAuth que le
  # dashboard). Agrege Glances + le control server gluetun cote serveur, car
  # ni l'un ni l'autre n'est joignable depuis un navigateur.
  ops-console:
    build:
      context: ./ops-console
    container_name: ops-console
    environment:
      - TZ=${TZ}
      # Lecture seule du bucket Glacier pour suivre les uploads multipart en
      # cours (le plugin Jellyfin ne publie aucune progression). Memes cles que
      # backup-config.sh, resolues depuis .env par compose.
      - SCW_ACCESS_KEY=${SCW_ACCESS_KEY}
      - SCW_SECRET_KEY=${SCW_SECRET_KEY}
      - SCW_REGION=${SCW_REGION}
      - GLACIER_BUCKET=jellyfin-glacier
      # Page /status : topic ntfy affiche UNIQUEMENT aux requetes passees par
      # l'OAuth (X-Auth-Request-User pose par Traefik). Jamais journalise.
      - NTFY_TOPIC=${NTFY_TOPIC}
    # memes cles que Homepage (sonarr/radarr/prowlarr/jellyfin) : pas de
    # duplication de secrets, le fichier reste hors git.
    env_file: ./homepage.env
    volumes:
      - /srv/docker/gluetun/auth/.apikey.txt:/gluetun-auth/.apikey.txt:ro
      # status.json ecrit par status-collect.py (root, timer 2 min). On monte le
      # DOSSIER, pas le fichier : le collecteur remplace status.json par rename
      # atomique, un bind de fichier resterait colle a l'ancien inode.
      - /srv/media-stack/status:/status-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ops-net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=ops-net
      - traefik.http.services.opsconsole.loadbalancer.server.port=8080
      - traefik.http.middlewares.ops-strip.stripprefix.prefixes=/ops
      #
      # La console occupe desormais la RACINE de home.maxibestof.com.
      # Homepage reste le catch-all du domaine (voir son bloc) : c'est ce qui
      # permet a ses assets absolus (/_next/..., /api/config/..., favicons)
      # de continuer a lui parvenir alors qu'il est servi sous /old.
      # La console ne revendique donc que des chemins precis :
      #   Path(`/`)      la page d'accueil, exactement
      #   /_ops/...      ses propres CSS/JS
      #   /api/state     /api/glacier   ses propres endpoints
      # Aucun de ces chemins n'est utilise par Homepage -> pas de collision.
      #
      # 1) racine exacte
      - traefik.http.routers.opsroot.rule=Host(`home.maxibestof.com`) && Path(`/`)
      - traefik.http.routers.opsroot.entrypoints=websecure
      - traefik.http.routers.opsroot.tls.certresolver=le
      - traefik.http.routers.opsroot.priority=300
      - traefik.http.routers.opsroot.service=opsconsole
      - traefik.http.routers.opsroot.middlewares=oauth-auth@docker
      # 2) assets + API de la console (pas de strip : les chemins sont deja bons)
      - traefik.http.routers.opsassets.rule=Host(`home.maxibestof.com`) && (PathPrefix(`/_ops/`) || PathPrefix(`/api/state`) || PathPrefix(`/api/glacier`))
      - traefik.http.routers.opsassets.entrypoints=websecure
      - traefik.http.routers.opsassets.tls.certresolver=le
      - traefik.http.routers.opsassets.priority=300
      - traefik.http.routers.opsassets.service=opsconsole
      - traefik.http.routers.opsassets.middlewares=oauth-auth@docker
      # 2bis) page de statut + son API, servies a leur vrai chemin -> PAS de
      # strip (comme opsroot/opsassets ; seul l'alias /ops est strippe).
      # /api/status/summary n'a pas besoin de ce routeur : Homepage le lit en
      # direct via ops-net (http://ops-console:8080).
      - traefik.http.routers.opsstatus.rule=Host(`home.maxibestof.com`) && (Path(`/status`) || PathPrefix(`/status/`) || PathPrefix(`/api/status`))
      - traefik.http.routers.opsstatus.entrypoints=websecure
      - traefik.http.routers.opsstatus.tls.certresolver=le
      - traefik.http.routers.opsstatus.priority=300
      - traefik.http.routers.opsstatus.service=opsconsole
      - traefik.http.routers.opsstatus.middlewares=oauth-auth@docker
      # 3) /ops conserve comme alias historique
      # ORDRE DES MIDDLEWARES : Traefik les applique de gauche a droite. Si le
      # strip passait avant l'auth, oauth2-proxy ne verrait que "/" et renverrait
      # l'utilisateur ailleurs apres login.
      - traefik.http.routers.opsconsole.rule=Host(`home.maxibestof.com`) && PathPrefix(`/ops`)
      - traefik.http.routers.opsconsole.entrypoints=websecure
      - traefik.http.routers.opsconsole.tls.certresolver=le
      - traefik.http.routers.opsconsole.priority=290
      - traefik.http.routers.opsconsole.middlewares=oauth-auth@docker,ops-strip@docker

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    pid: host
    network_mode: host
    environment:
      - TZ=${TZ}
      - GLANCES_OPT=-w -B 172.17.0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${BAZARR_CONFIG}:/config
      # Montage unique parent -> accède aux médias aux chemins /data annoncés par *arr (pas de path mapping). 2026-06-28
      - ${MEDIA_ROOT}:/data
    networks:
      - traefik-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.bazarr.rule=Host(`bazarr.maxibestof.com`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=le
      - traefik.http.routers.bazarr.middlewares=oauth-auth@docker
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - traefik.http.routers.bazarr-oauth.rule=Host(`bazarr.maxibestof.com`) && PathPrefix(`/oauth2/`)
      - traefik.http.routers.bazarr-oauth.entrypoints=websecure
      - traefik.http.routers.bazarr-oauth.tls.certresolver=le
      - traefik.http.routers.bazarr-oauth.service=oauth@docker

  jellyseerr:
    # Projet renommé Jellyseerr -> Seerr (2026). Ancienne image fallenbagel/jellyseerr
    # gelée à 2.7.3 ; la 3.x vit sous seerr-team/seerr. Bascule 2026-06-29.
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - ${JELLYSEERR_CONFIG}:/app/config
    networks:
      - traefik-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      # PAS d'OAuth : accès ouvert pour que d'autres se connectent avec leur compte Jellyfin (auth native Jellyseerr). 2026-06-16
      - traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.maxibestof.com`)
      - traefik.http.routers.jellyseerr.entrypoints=websecure
      - traefik.http.routers.jellyseerr.tls.certresolver=le
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055


volumes:
  letsencrypt:

networks:
  traefik-proxy:
    external: true
    name: traefik-proxy
  # Traefik ↔ vpn-control / ops-console uniquement (panneaux sensibles)
  ops-net:
    name: ops-net
